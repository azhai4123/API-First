# =========================================================================
# PATHS: SẢN PHẨM (/products)
# =========================================================================
products_collection:
  get:
    tags: [products]
    summary: Danh mục sản phẩm (phân trang và lọc)
    operationId: getProducts
    parameters:
      - name: page
        in: query
        schema: { type: integer, default: 0, minimum: 0 }
      - name: size
        in: query
        schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
      - name: sort
        in: query
        schema: { type: string, default: "id,asc" }
      - name: category
        in: query
        schema: { type: string }
    responses:
      '200':
        description: Thành công
        content:
          application/json:
            schema: { $ref: '../components/products.yaml#/ProductPageResponse' }
      '400':
        description: Tham số không hợp lệ
        content:
          application/json:
            schema: { $ref: '../components/common.yaml#/ErrorResponse' }
  post:
    tags: [products]
    summary: Thêm sản phẩm mới vào kho
    operationId: createProduct
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/products.yaml#/ProductCreateRequest' }
    responses:
      '201':
        description: Tạo thành công
        headers:
          Location:
            schema: { type: string, example: "/api/v1/products/101" }
        content:
          application/json:
            schema: { $ref: '../components/products.yaml#/ProductResponse' }
      '400':
        description: Dữ liệu không hợp lệ
        content:
          application/json:
            schema: { $ref: '../components/common.yaml#/ErrorResponse' }

products_item:
  get:
    tags: [products]
    summary: Chi tiết sản phẩm theo ID
    operationId: getProductById
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: Thành công
        content:
          application/json:
            schema: { $ref: '../components/products.yaml#/ProductResponse' }
      '404':
        description: Không tìm thấy
        content:
          application/json:
            schema: { $ref: '../components/common.yaml#/ErrorResponse' }
  patch:
    tags: [products]
    summary: Cập nhật một phần thông tin sản phẩm
    operationId: patchProduct
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/products.yaml#/ProductPatchRequest' }
    responses:
      '200':
        description: Cập nhật thành công
        content:
          application/json:
            schema: { $ref: '../components/products.yaml#/ProductResponse' }
      '404':
        description: Không tìm thấy
        content:
          application/json:
            schema: { $ref: '../components/common.yaml#/ErrorResponse' }
  delete:
    tags: [products]
    summary: Xóa sản phẩm
    operationId: deleteProduct
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '204':
        description: Xóa thành công (No Content)
      '404':
        description: Không tìm thấy
        content:
          application/json:
            schema: { $ref: '../components/common.yaml#/ErrorResponse' }


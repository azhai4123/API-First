# =========================================================================
# PRODUCTS SCHEMAS: QUẢN LÝ THÔNG TIN SẢN PHẨM & TỒN KHO
# =========================================================================
ProductResponse:
  type: object
  description: Dữ liệu chi tiết sản phẩm và tồn kho
  required:
    - id
    - name
    - sku
    - price
    - stockQuantity
    - category
  properties:
    id:
      type: integer
      format: int64
      description: ID sản phẩm
      example: 101
    name:
      type: string
      description: Tên thương mại sản phẩm
      example: "Bàn phím cơ không dây Keychron K2"
    sku:
      type: string
      description: Mã SKU quản lý tồn kho duy nhất
      example: "KB-KEYCHRON-K2"
    price:
      type: number
      format: double
      description: Đơn giá niêm yết (VND)
      example: 1850000.00
    stockQuantity:
      type: integer
      description: Số lượng còn lại trong kho
      example: 45
    category:
      type: string
      description: Tên hiển thị danh mục
      example: "Phụ kiện máy tính"
    categoryId:
      type: integer
      format: int64
      description: ID danh mục tham chiếu (Foreign Key)
      example: 1
    description:
      type: string
      description: Mô tả thông số sản phẩm
      example: "Bàn phím cơ Bluetooth 75% Layout, switch Gateron Brown"
    imageUrl:
      type: string
      format: uri
      description: Đường dẫn hình ảnh thực tế của sản phẩm
      example: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500"
    status:
      type: string
      enum: [ACTIVE, INACTIVE, OUT_OF_STOCK]
      example: "ACTIVE"
    createdAt:
      type: string
      format: date-time
      description: Thời điểm thêm sản phẩm vào hệ thống (ISO-8601 UTC)
      example: "2026-10-10T08:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: Thời điểm cập nhật sản phẩm gần nhất (ISO-8601 UTC)
      example: "2026-10-15T12:00:00Z"

ProductCreateRequest:
  type: object
  description: Dữ liệu thêm mới sản phẩm
  required:
    - name
    - sku
    - price
    - stockQuantity
    - category
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 150
      example: "Bàn phím cơ không dây Keychron K2"
    sku:
      type: string
      pattern: "^[A-Z0-9_-]{3,30}$"
      example: "KB-KEYCHRON-K2"
    price:
      type: number
      format: double
      minimum: 1000.0
      example: 1850000.00
    stockQuantity:
      type: integer
      minimum: 0
      example: 50
    category:
      type: string
      minLength: 2
      maxLength: 50
      example: "Phụ kiện máy tính"
    categoryId:
      type: integer
      format: int64
      description: ID danh mục bắt buộc
      example: 1
    description:
      type: string
      maxLength: 1000
      example: "Bàn phím cơ Bluetooth 75% Layout, switch Gateron Brown"
    imageUrl:
      type: string
      format: uri
      example: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500"

ProductPatchRequest:
  type: object
  description: Dữ liệu cập nhật một phần sản phẩm (giá, tồn kho, mô tả, danh mục)
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 150
      example: "Bàn phím cơ không dây Keychron K2 V2"
    categoryId:
      type: integer
      format: int64
      example: 1
    category:
      type: string
      example: "Phụ kiện"
    price:
      type: number
      format: double
      minimum: 1000.0
      example: 1950000.00
    stockQuantity:
      type: integer
      minimum: 0
      example: 40
    description:
      type: string
      maxLength: 1000
      example: "Phiên bản nâng cấp Led RGB Hot-swap"
    imageUrl:
      type: string
      format: uri
      example: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500"

ProductPageResponse:
  type: object
  description: Trang danh sách sản phẩm
  required:
    - content
    - page
  properties:
    content:
      type: array
      items:
        $ref: '#/ProductResponse'
    page:
      $ref: 'common.yaml#/PageMetadata'

